<script>

const honk = new Audio("/static/audio/honk.mp3")
const honk_button = document.getElementById("gong_button");
function playAudio(audio){ /* RETURNS A PROMISE, ENABLING US TO WAIT FOR AUDIO TO FINISH */
  return new Promise(res=>{
    audio.play()
    audio.onended = res
  })
}

honk_button.addEventListener("click", async function() {
    await playAudio(honk);
    window.location.href = "/";
}
)
